<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" role="img" aria-labelledby="title description">
  <title id="title">App Stylr example icon at 16 pixels</title>
  <desc id="description">A compact light checkmark on a graphite monochrome tile.</desc>
  <defs>
    <linearGradient id="icon-graphite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#383838" />
      <stop offset="1" stop-color="#202020" />
    </linearGradient>
  </defs>
  <rect width="16" height="16" rx="2.5" fill="url(#icon-graphite)" />
  <path d="M4.5 8 7 10.5 11.5 5.5" fill="none" stroke="#F5F5F5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
