<!doctype html>
<html lang="en" data-app-stylr-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>App Stylr example</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <p class="eyebrow">App Stylr example</p>
      <h1>One interface, two themes.</h1>
      <p class="intro">This card uses only semantic App Stylr roles. Change the theme attribute on the root element to <code>light</code> to swap values without changing component styles.</p>
      <section class="panel">
        <div>
          <span class="status"><i aria-hidden="true"></i> Ready</span>
          <h2>Release checklist</h2>
          <p>Keep the main action clear and supporting content quiet.</p>
        </div>
        <button type="button">Continue</button>
      </section>
    </main>
  </body>
</html>
