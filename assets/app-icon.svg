<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Project Plannr</title>
  <desc id="description">Three top-aligned planning columns, with a medium first column, short middle column, and long last column on the neutral Graphite base.</desc>
  <defs>
    <linearGradient id="icon-graphite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#383838" />
      <stop offset="1" stop-color="#202020" />
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="160" fill="url(#icon-graphite)" />
  <g fill="#F5F5F5" transform="translate(512 512) scale(1.1) translate(-512 -512)">
    <rect x="252" y="290" width="136" height="324" rx="36" />
    <rect x="444" y="290" width="136" height="204" rx="36" />
    <rect x="636" y="290" width="136" height="444" rx="36" />
  </g>
</svg>
